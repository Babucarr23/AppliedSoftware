<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSCI 240 - Fall 2026 - Student Projects</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f8; margin: 0; padding: 24px; }
    .box { max-width: 640px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    h1 { font-size: 22px; margin-top: 0; }
    ul { list-style: none; padding: 0; }
    li { margin: 8px 0; }
    a { display: block; padding: 10px 14px; background: #4b2e83; color: #fff; text-decoration: none; border-radius: 6px; }
    a:hover { background: #6a45b5; }
    a.register { background: #1f4fd8; text-align: center; font-weight: bold; margin-bottom: 20px; }
    a.register:hover { background: #3a68ea; }
    .pending { display: block; padding: 10px 14px; background: #e6e6ea; color: #888; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="box">
    <a class="register" href="registration.html">Student Registration - click here to enter your details</a>

    <h1>CSCI 240 - Fall 2026: Student Projects</h1>
    <ul id="list"></ul>
  </div>

  <script>
    // Add a student's number here after you merge their pull request.
    const submitted = [2];

    const total = 16;
    const list = document.getElementById("list");

    for (let i = 1; i <= total; i++) {
      const id = "student-" + String(i).padStart(2, "0");
      const li = document.createElement("li");

      if (submitted.includes(i)) {
        const a = document.createElement("a");
        a.href = id + "/test10.html";
        a.textContent = id;
        li.appendChild(a);
      } else {
        const s = document.createElement("span");
        s.className = "pending";
        s.textContent = id + " (not submitted yet)";
        li.appendChild(s);
      }
      list.appendChild(li);
    }
  </script>
</body>
</html>
